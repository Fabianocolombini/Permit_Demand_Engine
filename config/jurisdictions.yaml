    declared_valuation: JOBVALUE
    units: NUMOFUNITS
    is_residential: TYPEOFPROJECT
  date_format: mixed
  issued_date_min: "2021-01-01"
  notes: >
    Permit/permitlinks MapServer table PermitData (~555k total; ~248k issued
    >= 2021). ISSUED is ISO text (YYYY-MM-DD). No native geometry or site ZIP —
    compose ADDRESS from HOUSE/STREET* at normalize. Accela deeplink in DEEPLINK.
    Preferred non-Shovels full-history Manatee feed (path B).

# --- Onda 1 Tier B via Shovels.ai (paid/aggregated API) ---
# Resolve geo_id at pull time via /counties|/cities|/jurisdictions/search.
# Auth: SHOVELS_API_KEY env secret. Window: issued/start ≥ 2021-01-01.
# job_value from Shovels is cents; export adds job_value_usd.

- id: fl_broward_full_building
  name: "Broward County full building permits (Shovels)"
  state: FL
  county: "Broward"
  county_fips: "12011"
  level: county
  covers: full_county
  tier: B
  connector: shovels
  bronze_glob: "data/bronze/fl_broward_full_building/*.{csv,xlsx,xls}"
  shovels_county_q: "Broward"
  export_date_field: issue_date
  field_map:
    permit_id: number
    issued_date: issue_date
    address_raw: address_name
    city: address_city
    zip: address_zip_code
    description_raw: description
    work_class_raw: type
    permit_type_raw: subtype
    declared_valuation: job_value_usd
  date_format: iso_text
  issued_date_min: "2021-01-01"
  notes: >
    Shovels county geo pull for Broward (complements small HCED Posse ArcGIS subset).
    BCS citizen portal still has no open FeatureServer.

