  export_date_field: ISSUED
  arcgis_date_format: date_only
  export_monthly: true
  return_geometry: false
  order_by_fields: OBJECTID
  page_size: 2000
  field_map:
    permit_id: PERMITNUM
    issued_date: ISSUED
    applied_date: APPLYDATE
    address_raw: ADDRESS
    city: CITY
    description_raw: NOTE
    work_class_raw: SUBTYPE
