# Jurisdiction registry — Onda 1 Tier A endpoints successfully probed (2026-10-30).
# covers is critical: county Hub feeds are often unincorporated-only.
# Identity: PermitNumber (or local equivalent). Never map ContractorZip as site ZIP.
# Valuation: USD dollars.

- id: fl_miami_dade_county
  name: "Miami-Dade County (unincorporated)"
  state: FL
  county: "Miami-Dade"
  county_fips: "12086"
  level: county
  covers: unincorporated_only
  tier: A
  connector: arcgis
  endpoint: "https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/miamidade_permit_data/FeatureServer"
  layer: 0
  bronze_glob: "data/bronze/fl_miami_dade_county/*.{csv,xlsx,xls}"
  raw_glob: "data/raw/fl_miami_dade_county/*.{csv,xlsx,xls}"
  export_date_field: PermitIssuedDate
  arcgis_date_format: date_only
  export_monthly: true
  field_map:
    permit_id: PermitNumber
    issued_date: PermitIssuedDate
    applied_date: ApplicationDate
    address_raw: PropertyAddress
    city: City
    state: State
    description_raw: DetailDescriptionComments
    work_class_raw: ProposedUseDescription
    permit_type_raw: PermitType
    declared_valuation: EstimatedValue
    contractor_name: ContractorName
    contractor_license: ContractorNumber
    owner_name: OwnerName
    square_feet: SquareFootage
    units: StructureUnits
    is_residential: ResidentialCommercial
  date_format: mixed
  issued_date_min: "2021-01-01"
  notes: >
    Unincorporated county only — incorporated cities (Miami, Hialeah, etc.) emit
    separately. Hub table has no native geometry or site ZIP; never use ContractorZip.
    Post-2021 window ≈420k rows (probed).

- id: fl_miami_city
  name: "City of Miami"
  state: FL
  county: "Miami-Dade"
  county_fips: "12086"
  level: city
  covers: city
  tier: A
  connector: arcgis
  endpoint: "https://services1.arcgis.com/CvuPhqcTQpZPT9qY/arcgis/rest/services/Building_Permits_Since_2014/FeatureServer"
  layer: 0
  bronze_glob: "data/bronze/fl_miami_city/*.{csv,xlsx,xls}"
  export_date_field: IssuedDate
  arcgis_date_format: date_only
  export_monthly: true
  return_geometry: true
  field_map:
    permit_id: PermitNumber
    issued_date: IssuedDate
    address_raw: DeliveryAddress
    description_raw: ScopeofWork
    work_class_raw: WorkItems
    permit_type_raw: PropertyType
    declared_valuation: TotalCost
    contractor_name: CompanyName
    square_feet: TotalSQFT
  date_format: epoch_ms
  issued_date_min: "2021-01-01"
  notes: >
    City of Miami Building Department permits since 2014 (owner CityMiamiFL).
    Complements Miami-Dade unincorporated Hub. Attributes include Miami21Zone.
    IssuedDate stored as epoch ms; WHERE clause accepts date_only strings.
    Valuation = TotalCost (USD). CompanyZip is contractor — never site ZIP.

- id: fl_broward_county
