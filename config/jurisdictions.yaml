- id: fl_hillsborough_county
  name: "Hillsborough County (Planning Commission Building Permits)"
  state: FL
  county: "Hillsborough"
  county_fips: "12057"
  level: county
  covers: full_county
  tier: A
  connector: arcgis
  endpoint: "https://gis.tpcmaps.org/arcgis/rest/services/Websites/BuildingPermits/MapServer"
  layer: 1
  bronze_glob: "data/bronze/fl_hillsborough_county/*.{csv,xlsx,xls}"
  export_date_field: ISSUE_YR
  arcgis_date_format: year_int
  export_monthly: false
  export_where: "ISSUE_YR >= 2021"
  return_geometry: true
  field_map:
    permit_id: PERMITNO
    issued_date: ISSUE_DATE
    address_raw: ADDRESS
    description_raw: DESCRIPTION
    work_class_raw: CLASS
    permit_type_raw: TYPE
    declared_valuation: VALUATION
    units: NUNITS
  date_format: iso_text
  issued_date_min: "2021-01-01"
  notes: >
    Hillsborough Planning Commission layer labeled with jurisdictions including
    Hillsborough County, Tampa, Plant City, Temple Terrace — treat as full_county
    until city-level feeds are dual-ingested. ISSUE_DATE is a YYYY_MM period key
    (not a day); filter via ISSUE_YR >= 2021. Post-2021 ≈30k rows (probed).

