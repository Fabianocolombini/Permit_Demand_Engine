[project]
name = "permit-demand-engine"
version = "0.1.0"
description = "Florida building-permit demand intelligence for plastic fittings (Tigre / Dura demo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "polars>=1.9.0",
  "pyarrow>=14.0.0",
  "numpy>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openpyxl>=3.1.0",
  "xlsx2csv>=0.8.3",
  "python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
